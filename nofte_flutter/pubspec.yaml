name: nofte_flutter
description: NoFTe - Deteksi & Pantau Kesegaran Makanan
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # SVG Support
  flutter_svg: ^2.0.10+1

  # Image picking from camera/gallery
  image_picker: ^1.1.2

  # HTTP client for API calls
  http: ^1.2.2

  # Local storage for session
  shared_preferences: ^2.3.2

  # Provider for state management
  provider: ^6.1.2

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
