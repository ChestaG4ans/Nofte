<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Makanan - NoFTe</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
    <img src="assets/logo.png" class="logo-icon" alt="NoFTe Logo">
    <span>NoFTe</span>
</div>

<nav>
<a href="index.html">🏠 Dashboard</a>
<a href="scan.html" class="active">📷 Scan Makanan</a>
<a href="history.html">📄 Riwayat</a>
<a href="expiry.html">⏰ Kadaluarsa</a>
<a href="inventory.html">📦 Inventory</a>
<a href="assistant.html">🤖 AI Assistant</a>
<a href="settings.html">⚙ Settings</a>
</nav>

</aside>

<main class="main">

<h1>Scan Makanan</h1>

<div class="card">

<h2>Upload Gambar</h2>

<div class="preview-wrap">

<img id="previewImage">

<div id="emptyState">
📸 Pilih gambar makanan
</div>

</div>

<div class="toolbar">

<label for="imageInput" class="btn">
Pilih Gambar
</label>

<button id="scanButton">
Scan AI
</button>

</div>

<input
id="imageInput"
type="file"
accept="image/*"
hidden>

</div>

<div class="card">

<h2>Hasil Scan</h2>

<div id="results">

<p>Belum ada hasil scan.</p>

</div>

</div>

</main>

</div>

<script src="auth.js"></script>
<script src="scan.js"></script>

<script>
(function() {
    const theme = localStorage.getItem('nofte-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
})();
</script>

</body>
</html>
