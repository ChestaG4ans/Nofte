<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
    <img src="assets/logo.png" class="logo-icon" alt="NoFTe Logo">
    <span>NoFTe</span>
</div>

<nav>
<a href="index.html">🏠 Dashboard</a>
<a href="scan.html">📷 Scan Makanan</a>
<a href="history.html">📄 Riwayat</a>
<a href="expiry.html">⏰ Kadaluarsa</a>
<a href="inventory.html" class="active">📦 Inventory</a>
<a href="assistant.html">🤖 AI Assistant</a>
<a href="settings.html">⚙ Settings</a>
</nav>

</aside>

<main class="main">

<h1>Inventory Dapur</h1>

<div class="card">
<form id="inventoryForm" class="inventory-form">
<input type="text" id="itemName" placeholder="Nama barang" required>
<input type="number" id="itemQty" placeholder="Jumlah" min="1" required>
<input type="text" id="itemUnit" placeholder="Satuan (Buah/Kg/Kotak)" required>
<input type="number" id="itemExpiry" placeholder="Kadaluarsa (hari)" min="0" value="0" required>
<button class="primary-btn" type="submit">+ Tambah Barang</button>
</form>
<p id="inventoryMessage"></p>
</div>

<div id="inventoryGrid" class="inventory-grid"></div>

</main>

</div>

<script src="auth.js"></script>
<script src="inventory.js"></script>

<script>
(function() {
    const theme = localStorage.getItem('nofte-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
})();
</script>

</body>
</html>
